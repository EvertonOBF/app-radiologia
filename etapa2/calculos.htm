<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado: Cálculos de Eletrostática</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; padding: 20px; }
        .container { max-width: 750px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .question { margin-bottom: 25px; padding: 15px; border: 1px solid #e9ecef; border-radius: 8px; }
        .q-text { font-weight: bold; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option { padding: 12px; border: 1px solid #ced4da; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .option:hover { background-color: #f1f3f5; }
        .correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .incorrect { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        .explanation { display: none; margin-top: 15px; padding: 15px; background-color: #e3f2fd; border-left: 5px solid #2196f3; font-size: 0.95em; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulado: Cálculos de Eletrostática</h1>

    <div id="quiz-box"></div>

    <button onclick="window.location.reload()" style="width:100%; padding:15px; background:#2c3e50; color:white; border:none; border-radius:5px; cursor:pointer; font-size: 16px; font-weight: bold;">Reiniciar Simulado</button>
</div>

<script>
const questions = [
    {
        q: "Uma carga de prova de 2 μC (2 x 10⁻⁶ C) é colocada em um ponto onde o campo elétrico tem intensidade de 5 x 10³ N/C. Qual o valor da força elétrica que atua sobre essa carga?",
        options: ["A) 0,01 N", "B) 10 N", "C) 2,5 N", "D) 0,002 N", "E) 0,1 N"],
        correct: 0,
        exp: "Usamos F = q . E. Logo: F = (2 x 10⁻⁶) * (5 x 10³) = 10 x 10⁻³ = 0,01 N."
    },
    {
        q: "Qual a intensidade do campo elétrico gerado por uma carga puntiforme Q = 4 μC (4 x 10⁻⁶ C) a uma distância de 2 metros no vácuo?",
        options: ["A) 18.000 N/C", "B) 9.000 N/C", "C) 4.500 N/C", "D) 36.000 N/C", "E) 2.000 N/C"],
        correct: 1,
        exp: "E = K.Q / d². E = (9 x 10⁹ * 4 x 10⁻⁶) / 2² -> E = (36 x 10³) / 4 = 9.000 N/C."
    },
    {
        q: "Duas cargas puntiformes idênticas de 1 C cada estão separadas por uma distância de 3 metros no vácuo. A força de repulsão entre elas é de:",
        options: ["A) 1 x 10⁹ N", "B) 3 x 10⁹ N", "C) 9 x 10⁹ N", "D) 27 x 10⁹ N", "E) 1/3 x 10⁹ N"],
        correct: 0,
        exp: "F = K.Q1.Q2 / d². F = (9 x 10⁹ * 1 * 1) / 3² -> F = 9 x 10⁹ / 9 = 1 x 10⁹ N."
    },
    {
        q: "Se uma força de 12 N atua sobre uma carga de 3 C colocada em um ponto P, qual é a intensidade do campo elétrico nesse ponto?",
        options: ["A) 36 N/C", "B) 4 N/C", "C) 0,25 N/C", "D) 15 N/C", "E) 9 N/C"],
        correct: 1,
        exp: "E = F / q. E = 12 / 3 = 4 N/C."
    },
    {
        q: "Uma carga geradora Q cria um campo E em um ponto a 1 metro de distância. Se dobrarmos a distância para 2 metros, o novo campo elétrico será:",
        options: ["A) O dobro do inicial.", "B) Metade do inicial.", "C) O quádruplo do inicial.", "D) Um quarto (1/4) do inicial.", "E) Igual ao inicial."],
        correct: 3,
        exp: "O campo é inversamente proporcional ao quadrado da distância. Se a distância dobra (2x), o campo diminui 2² vezes, ou seja, 4 vezes (1/4)."
    }
];

const quizBox = document.getElementById('quiz-box');

questions.forEach((item, index) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.innerHTML = `<div class="q-text">${index + 1}. ${item.q}</div><div class="options" id="opt-container-${index}"></div><div class="explanation" id="explain-${index}"><strong>Explicação:</strong> ${item.exp}</div>`;
    quizBox.appendChild(qDiv);

    const optContainer = document.getElementById(`opt-container-${index}`);
    item.options.forEach((opt, optIdx) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => {
            const btns = optContainer.querySelectorAll('.option');
            btns.forEach(b => b.style.pointerEvents = 'none');
            if(optIdx === item.correct) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
                btns[item.correct].classList.add('correct');
            }
            document.getElementById(`explain-${index}`).style.display = 'block';
        };
        optContainer.appendChild(btn);
    });
});
</script>

</body>
</html>
